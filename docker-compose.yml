services:
  portal:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-7892}:${PORT:-7892}"
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Rutas DENTRO del contenedor; deben apuntar al volumen compartido con la API de Actualitodo.
      APPS_DIR: /data/apps
      TARIFAS_DIR: /data/envArch
    volumes:
      - ${HOST_APPS_DIR:-/var/www/actualiTodo/version}:/data/apps
      - ${HOST_TARIFAS_DIR:-/var/www/G.A.C/envArch/uploads}:/data/envArch
