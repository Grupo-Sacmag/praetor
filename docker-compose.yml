services:
  portal:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-7892}:${PORT:-7892}"
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Rutas DENTRO del contenedor
      APPS_DIR: /data/archivosACT/aplicaciones
      TARIFAS_DIR: /data/archivosACT/tarifas
      INDICES_DIR: /data/archivosACT/INDICES
    volumes:
      # Carpeta física unificada en /var/www/archivosACT
      - ${HOST_ARCHIVOS_DIR:-/var/www/archivosACT}:/data/archivosACT
